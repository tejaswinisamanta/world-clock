<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clcok - Tejaswini Samanta</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <select>
            <option value="">Select a city..</option>
            <option value="">New York</option>
            <option value="">Paris</option>
            <option value="">London</option>
            <option value="">New Delhi</option>
        </select>

        <div class="city">
            <div>
            <h2>New York 🇺🇸</h2>
            <div class="date">September 9 2026</div>
            </div>
            <div class="time">9:39:46 <small>PM</small></div>
        </div>
        <div class="city">
            <div>
            <h2>New Delhi </h2>
            <div class="date">September 9 2026</div>
            </div>
            <div class="time">9:39:46 <small>PM</small></div>
        </div>
    </div>



    <footer>This project was coded by <a href="https://tejaswinisamanta.github.io/"><strong>Tejaswini Samanta</strong></a> 
        and is open sourced on <a href="https://github.com/tejaswinisamanta/world-clock" target="_blank">GitHub</a></footer>
    <script src="javascript/index.js"></script>
</body>
</html>
